# ============================================================
# orbcraft —— 版本锁
#
# 这一份文件是**全项目唯一的版本来源**。build.gradle 只读它，
# 不要在别处硬编码版本号：五路并行时最容易出的问题就是
# 「几个人几个 loader 版本」，合并后 runServer 起不来。
# ============================================================

# ---- Gradle 自身 ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Fabric 版本锁（改这里 = 改全项目）----
#
# 这一组不是「各取最新」，是「Fabric API 0.141.6+1.21.11 自己构建时用的那一组」。
# 依据：github.com/FabricMC/fabric 的 1.21.11 分支（build.gradle + gradle.properties）。
#
# 1.21.11 对 Loom 版本很挑，两条踩过的坑记在这，别重犯：
#   1. Loom 1.18 / 1.19 的 module metadata 声明 org.gradle.jvm.version = 25，
#      即「跑构建的 JVM 必须是 25」。本项目与 MC 1.21.11 都是 Java 21 → 不能用。
#   2. Loom 1.16 / 1.17 取消了 `mappings` configuration（报 Could not find method
#      mappings()），并且把 1.21.11 判成 non-obfuscated，导致 Fabric API 的
#      access widener 命名空间冲突（expected official, found intermediary）→ 不能用。
# Loom 1.13.3 是 1.21.11 时期的稳定版：jvm 21、pluginApi 8.14、支持 mojmap。
minecraft_version=1.21.11
loader_version=0.17.3
fabric_api_version=0.141.6+1.21.11
loom_version=1.13.3

# 映射方式：Mojang 官方映射（见 build.gradle 的 mappings 行），不用 Yarn。
# 1.21.11 的官方模板与 Fabric API 自身都走 mojmap；混用会让查资料时的类名对不上
# （yarn 的 net.minecraft.item.Item vs mojmap 的 net.minecraft.world.item.Item）。

# ---- 模组元信息 ----
mod_version=0.1.0-SNAPSHOT
maven_group=com.orbcraft
archives_base_name=orbcraft

# ---- 目标 Java ----
# MC 1.21.11 要求 Java 21；core 也是按 --release 21 编的，两边必须一致，
# 否则模组运行时会在 core 的 record / switch pattern 上抛 UnsupportedClassVersionError。
java_version=21
