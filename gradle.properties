# ============================================================
# orbcraft —— 版本锁
#
# 这一份文件是**全项目唯一的版本来源**。build.gradle 只读它，
# 不要在别处硬编码版本号：五路并行时最容易出的问题就是
# 「几个人几个 loader 版本」，合并后 runServer 起不来。
# ============================================================

# ---- Gradle 自身 ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Fabric 版本锁（改这里 = 改全项目）----
#
# 这一组不是「各取最新」，是「Fabric API 0.141.6+1.21.11 自己构建时用的那一组」。
# 依据：github.com/FabricMC/fabric 的 1.21.11 分支（build.gradle + gradle.properties）。
#
# 1.21.11 对 Loom 版本很挑，踩过的坑记在这，别再犯：
#   1. Loom 1.18 / 1.19 的 module metadata 声明 org.gradle.jvm.version = 25，
#      即「跑构建的 JVM 必须是 25」。本项目与 MC 1.21.11 都是 Java 21 → 不能用。
#   2. Loom 1.16 / 1.17 取消了 `mappings` configuration（报 Could not find method
#      mappings()），并且把 1.21.11 判成 non-obfuscated，导致 Fabric API 的
#      access widener 命名空间冲突（expected official, found intermediary）→ 不能用。
#   3. Loom 1.13.3 曾是 1.21.11 时期的稳定版（jvm 21、pluginApi 8.14、支持 mojmap），
#      但 2026-10 引入第三方依赖（owo-lib / BetterModel 等）后构建报
#      "Mod was built with a newer version of Loom (1.15.3)"：这些库的发布 jar
#      由作者用 Loom 1.15.x 构建，manifest 带 Fabric-Loom-Version 标记，
#      Loom 1.13.3 拒绝处理比自己新的 jar。1.15.x 不踩 1/2 两条坑（jvm 21、
#      仍有 mappings configuration），且与依赖作者的构建环境一致 → 升到 1.15.3。
minecraft_version=1.21.11
loader_version=0.17.3
fabric_api_version=0.141.6+1.21.11
loom_version=1.15.3

# 映射方式：Mojang 官方映射（见 build.gradle 的 mappings 行），不用 Yarn。
# 1.21.11 的官方模板与 Fabric API 自身都走 mojmap；混用会让查资料时的类名对不上
# （yarn 的 net.minecraft.item.Item vs mojmap 的 net.minecraft.world.item.Item）。

# ---- 模组元信息 ----
mod_version=0.1.0-SNAPSHOT
maven_group=com.orbcraft
archives_base_name=orbcraft

# ---- 第三方开源依赖（详细署名与许可证记录见 docs/ACKNOWLEDGMENTS.md）----
#
# 这一组全部是「1.21.11 适配版」，升级 MC 时必须逐个重新核对
# （26.x 断层期很多库没有跟上，坐标与写法都会变）。
#
# owo-lib：声明式 UI / 配置 / 网络，wisp-forest 出品，MIT。
# 来源 maven：https://maven.wispforest.io
owo_version=0.13.0+1.21.11

# PAL（PlayerAnimationLibFabric）：玩家模型动画库，ZigyTheBird 出品，MIT，
# 是已停更的 KosmX/PlayerAnimator 的官方指定后继。
# 来源 maven：https://repo.redlance.org/public
pal_version=1.1.11+mc.1.21.11

# fabric-permissions-api：命令权限检查（可对接 LuckPerms 等），lucko 出品，MIT。
# 官方版本矩阵：1.21.11 → 0.6.1（26.1 起才改用 implementation 而非 modImplementation）。
# 来源 maven：Maven Central
fabric_permissions_version=0.6.1

# BetterModel：服务端驱动的自定义实体外观（.bbmodel → 资源包 → item_display），
# toxicity188 出品，MIT。仅 modCompileOnly：缺它时 core 的 ModelBackends
# 自动退化到兜底后端，玩家照样进服，所以不进 depends、不 include。
# 1.21.11 对应 2.2.0，官方 Maven Central 上的 3.x 要求 Java 25（本机与玩家都是 21），
# 因此走 Modrinth Maven 的 file ID（4h8rX3rt 是 bettermodel 项目 id，GrvAMlui 是 2.2.0+1.21.11 的文件 id）。
bettermodel_file_id=GrvAMlui

# Flan：领地保护兼容层（运行时探测，未安装则整段跳过）。Flemmli97 出品，
# ARR 许可——只允许调用其公开 API，绝不可搬运其源码进本仓库。
# 来源 maven：https://maven.blazing-coop.net/releases
flan_version=1.21.11-1.12.7-fabric

# ---- 目标 Java ----
# MC 1.21.11 要求 Java 21；core 也是按 --release 21 编的，两边必须一致，
# 否则模组运行时会在 core 的 record / switch pattern 上抛 UnsupportedClassVersionError。
java_version=21
